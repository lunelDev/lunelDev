name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lunelDev
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          output_action: none

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lunelDev
          filename: github-metrics-languages.svg
          base: ""
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          output_action: none

      - name: Commit cards
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@example.com"
          git add github-metrics.svg github-metrics-languages.svg
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: update metrics cards"
          git push
