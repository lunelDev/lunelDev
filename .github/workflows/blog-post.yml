name: Latest Blog Posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest Tistory posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://j2su0218.tistory.com/rss"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
